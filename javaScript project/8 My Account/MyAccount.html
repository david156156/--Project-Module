<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MY ACCOUNT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
  <div class="container">
    <div class="row my-3">
      <h1 class="text-center text-primary display-4">
        MY<i class="text-secondary fa-solid fa-chart-pie"></i>ACCOUNT
      </h1>
    </div>

    <div class="alert alert-secondary rounded-2 mb-3 text-center h3 text-secondary">
      Balance: <span id="balance"></span>
    </div>
    <div class="containr" id="">
      <div class="row">
        <div class="col-sm-4">
          <select class="form-select mb-2" aria-label="Default select example" id="selectType">
            <option selected>Income</option>
            <option value="Expenditure">Expenditure</option>
          </select>
          <div class="mb-2">
            <input type="text" class="form-control" id="inputDescription" aria-describedby="emailHelp"
              placeholder="Description" />
          </div>
          <div class="mb-2">
            <input type="number" class="form-control" id="inputAmount" aria-describedby="emailHelp"
              placeholder="Amount" />
          </div>
          <button onclick="addNewAction()" type="button" class="btn btn-primary w-100">
            Add
          </button>
        </div>
        <div class="col-sm-8">
          <table class="table col-9 text-center">
            <thead>
              <tr>
                <th scope="col-5">Description</th>
                <th scope="col-5">Amount</th>
                <th scope="col-1"></th>
                <th scope="col-1"></th>
              </tr>
            </thead>
            <tbody id="newTr"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="./script.js" type="module"></script>
</body>

</html>
