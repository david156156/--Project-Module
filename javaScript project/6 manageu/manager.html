<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      .btn-success {
        background-color: #aae68e;
        border-color: #aae68e;
      }
      .btn-success:hover {
        background-color: #7ebd60;
        border-color: #7ebd60;
      }
      .btn-primary {
        background-color: #558eda;
        border-color: #558eda;
      }
      .btn-primary:hover {
        background-color: #396bad;
        border-color: #396bad;
      }
      .btn-danger {
        background-color: #da5555;
        border-color: #da5555;
      }
      .btn-danger:hover {
        background-color: #b43a3a;
        border-color: #b43a3a;
      }
    </style>
  </head>

  <body>
    <div class="container text-center border rounded-2">
      <div class="row">
        <h1 class="text-white display-4 text-bg-secondary">
          MANAGE-U <i class="fa-solid fa-check-double text-warning"></i>
        </h1>
      </div>
      <div class="input-group mb-3">
        <input
          id="description"
          type="text"
          class="form-control"
          placeholder="Task descrition"
          aria-label="Recipient's username"
          aria-describedby="button-addon2"
        />
        <button
          onclick="addNewTask()"
          class="btn btn-warning"
          type="button"
          id="button-addon2"
        >
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>
    </div>
    <div class="container text-center">
      <div>
        <h3 class="display-5 text-success">Active</h3>
        <ul id="activeTasks" class="list-group mb-4 mt-3"></ul>
      </div>
      <div>
        <h3 class="display-5 text-danger">Completed</h3>
        <ul id="completedTasks" class="list-group mt-3"></ul>
      </div>
    </div>

    <script src="./script.js" type="module"></script>
  </body>
</html>
