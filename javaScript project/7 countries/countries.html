<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
</head>

<body>
  <div class="container">
    <h1 class="display-4 text-center">Please enter the name of the capital city</h1>
    <div class="container mt-5">
      <form class="d-flex">
        <input id="SearchByName" class="form-control" type="search" placeholder="Search" aria-label="Search" />
        <div onclick="search()" class="btn btn-outline-primary" type="submit">
          Search
        </div>
      </form>
    </div>
    <div id="countries" class="card container mt-4" style="width: 18rem"></div>
  </div>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script>
    function search() {
      let input = document.getElementById("SearchByName").value;
      axios
        .get(`https://restcountries.com/v3.1/capital/${input}`)
        .then((capital) => {
          console.log(capital.data);
          console.log(input);

          let country = capital.data[0];
          let languages = country.languages;
          let languagesList = "";
          for (const key in languages) {
            languagesList += `<span>${languages[key]}</span>, `;
          }
          document.getElementById("countries").innerHTML = `<img src="${country.flags.png
            }" class="card-img-top" alt="${country.flags.alt}" />
        <div class="card-body">
          <h5 class="card-title"><span class="h4 fw-bold">common:</span> ${country.name.common
            }</h5>
          <h5 class="card-title"><span class="h4 fw-bold">population:</span> ${country.population.toLocaleString()}</h5>
          <h5 class="card-title"><span class="h4 fw-bold">region:</span> ${country.region
            }</h5>
          <h5 class="card-title"><span class="h4 fw-bold">languages:</span> ${languagesList}</h5>
        </div>`;
        });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
