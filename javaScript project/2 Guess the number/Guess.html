<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the number</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <style>
      .ring {
        width: 60px;
        height: 60px;
        font-size: 1.7rem;
        font-weight: bold;
        appearance: none;
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
      }

      .bg-info,
      .btn-info,
      button:hover {
        background-color: #00c3ffc9 !important;
      }
    </style>
  </head>

  <body>
    <div
      style="background-color: rgba(255, 196, 0, 0.61)"
      class="container text-center rounded-2"
    >
      <div class="row">
        <h1 class="mb-4 display-4 text-primary bg-info rounded-2">
          Guess the number
        </h1>
        <div class="col-12 col-sm-5">
          <p>You have 5 attampts to guess number (1-10):</p>
          <div class="row justify-content-center">
            <label for="number">Your guess:</label>
            <input
              id="number"
              type="number"
              class="form-control my-2 rounded-circle text-center ring"
            />
          </div>
          <div class="row">
            <button id="Check" onclick="Check()" class="btn btn-info">
              Check
            </button>
          </div>
        </div>

        <div class="col-12 mt-3 col-sm-7 mt-sm-0">
          <button
            id="again"
            onclick="again()"
            class="btn btn-outline-info"
            disabled
          >
            start again
          </button>
          <div id="par"></div>
          <div id="err"></div>
        </div>
      </div>
    </div>
    <script>
      let randomNumber = Math.ceil(Math.random() * 10);
      console.log(randomNumber);

      let checkNum = 0;
      function Check() {
        document.getElementById("err").innerHTML = "";

        let num = document.getElementById("number").value;
        if (num > 10 || num < 1 || num == isNaN(1)) {
          document.getElementById(
            "err"
          ).innerHTML = `<p  style="color: orange;">Please enter number between 1 end 10</p>`;
        } else if (num < randomNumber) {
          document.getElementById(
            "par"
          ).innerHTML += `<p  style="color: red;">${num} is too small</p>`;
          checkNum++;
        } else if (num > randomNumber) {
          document.getElementById(
            "par"
          ).innerHTML += `<p style="color: red;">${num} is too biger</p>`;

          checkNum++;
        } else if (num == randomNumber) {
          document.getElementById(
            "par"
          ).innerHTML += `<p style="color: green; font-weight: bold;">you win ${num} is the number</p>`;
          document.getElementById("number").readOnly = true;
          document.getElementById("Check").disabled = true;

          checkNum++;
          document.getElementById("again").disabled = false;
        }
        if (checkNum == 5) {
          document.getElementById(
            "par"
          ).innerHTML += `<p  style="color: red; font-weight: bold;">you lost the game. the number was ${randomNumber}.</p>`;
          document.getElementById("par").style.color = "red";
          document.getElementById("number").readOnly = true;
          document.getElementById("Check").disabled = true;
          document.getElementById("again").disabled = false;
        }
        console.log(checkNum);

        document.getElementById("number").value = "";
      }

      function again() {
        checkNum = 0;
        document.getElementById("number").readOnly = false;
        document.getElementById("Check").disabled = false;
        document.getElementById("par").innerHTML = ``;
        document.getElementById("number").value = "";
        randomNumber = Math.ceil(Math.random() * 10);
        console.log(randomNumber);
        document.getElementById("again").disabled = true;
      }
    </script>
  </body>
</html>
