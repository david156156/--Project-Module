<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>טופס כניסה ויצירת חשבון</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      form {
        width: 270px !important;
      }
    </style>
  </head>
  <body>
    <h1 class="text-center display-6 mt-5">טופס כניסה ויצירת חשבון</h1>
    <div class="container d-flex justify-content-center">
      <form class="container row g-3 m-2 rounded shadow">
        <p class="h6 text-center">אנא הכנס קוד לפחות עם 4 תוים</p>
        <div class="">
          <input
            type="email"
            class="form-control"
            id="inputEmail"
            placeholder="Enter Yor Email"
            required
          />
        </div>
        <div class="">
          <input
            type="password"
            class="form-control"
            id="inputPassword"
            placeholder="Enter Yor Password"
            required
          />
        </div>
        <p id="warning" class="text-danger h6 text-center"></p>
        <div class="col">
          <button
            onclick="Login(users)"
            type="submit"
            class="btn btn-primary mb-3 w-100"
          >
            Login
          </button>
        </div>
        <div class="col">
          <button
            onclick="signUp()"
            type="submit"
            class="btn btn-primary mb-3 w-100"
          >
            Sign Up
          </button>
        </div>
      </form>
    </div>

    <script>
      let users;
      function loadingPage() {
        users = JSON.parse(localStorage.getItem("users")) || [];
      }
      loadingPage();

      class NewUsers {
        constructor(email, password) {
          this.email = email;
          this.password = password;
        }
      }
      console.log(users);

      function signUp() {
        document.getElementById("warning").innerText = "";
        event.preventDefault();
        let email = document.getElementById("inputEmail").value;
        let password = document.getElementById("inputPassword").value;
        let existingUser = users.find((user) => user.email === email);
        if (existingUser) {
          document.getElementById("warning").innerText =
            "האימייל כבר קיים במערכת";
        } else if (password.length < 4) {
          document.getElementById("warning").innerText =
            "אנא הכנס קוד לפחות עם 4 תוים";
        } else if (email && password !== "") {
          users.push(new NewUsers(email, password));
          localStorage.setItem("users", JSON.stringify(users));
        }
        document.getElementById("inputPassword").innerText = "";
      }

      function checkUser(users, user) {
        return new Promise((resolve, reject) => {
          setTimeout(() => {
            for (const i in users) {
              if (
                user.email == users[i].email &&
                user.password == users[i].password
              ) {
                resolve(
                  `email: ${users[i].email}, password: ${users[i].password}`
                );
                return;
              }
            }
            reject(new Error("אימייל או סיסמה שגויים"));
          }, 500);
        });
      }

      async function Login(users) {
        document.getElementById("warning").innerText = "";

        event.preventDefault();
        let email = document.getElementById("inputEmail").value;
        let password = document.getElementById("inputPassword").value;
        let user = { email: email, password: password };
        console.log(user);
        try {
          let fnChec = await checkUser(users, user);
          console.log(fnChec);
          alert(`ברוכים הבאים ${user.email}`);
          window.location.href = "\prics.html";
        } catch (error) {
          document.getElementById("warning").innerText =
            "אימייל או סיסמה שגויים";
        }
        document.getElementById("inputPassword").value = "";
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
